# content is served at / (changing it recreates the workload through its Config).
content: v1
# healthy=false makes the healthcheck fail.
healthy: true
# listener=<name> exposes the web port on that tcp gateway listener (the test adds it).
listener: ""
# route=<host> exposes the web port for that host on gateway listener routeListener.
route: ""
routeListener: web
# startDelay seconds before the server listens, like a real application starting up.
startDelay: 0
# strategy is the update strategy.
strategy: replace
# listenPort is the port the server listens on (the containerPort); servicePort is the port of
# Service web (default listenPort).
listenPort: 8080
servicePort: 0
# second=true adds workload and Service api, serving the same content on listenPort+1.
second: false
# echo=true adds a tcp echo server on containerPort 9000 (Service web port 9000); echoListener=<name>
# exposes it on that tcp gateway listener.
echo: false
echoListener: ""
# drain is the replace drain timeout.
drain: 2s
# tls.cert/tls.key (PEM) serve the route on an https listener; plain HTTP on port 80 redirects to it.
tls:
  cert: ""
  key: ""
# health is the web workload's health check type: exec (wget in the image), tcp or http (karga checks).
# With http, healthy=false checks a missing path.
health: exec
