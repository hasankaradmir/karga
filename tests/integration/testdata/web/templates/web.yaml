apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: web-net
---
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: site
spec:
  files:
    index.html: {{ .Values.content | quote }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; exec httpd -f -p {{ .Values.listenPort }} -h /www"]
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  {{- if .Values.publish }}
  ports:
    - containerPort: {{ .Values.listenPort }}
      hostPort: {{ .Values.port }}
  {{- end }}
  healthCheck:
    type: exec
    {{- if .Values.healthy }}
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ .Values.listenPort }}/"]
    {{- else }}
    command: ["false"]
    {{- end }}
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: replace
    drainTimeout: 2s
    proxy: {{ .Values.proxy }}
