# Release builds: `git tag vX.Y.Z && git push --tags` runs .github/workflows/release.yml.
# Local check: goreleaser release --snapshot --clean
version: 2

project_name: karga

builds:
  - id: karga
    main: ./cmd/karga
    binary: karga
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hasankaradmir/karga-cli/internal/version.Version=v{{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - USAGE.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: checksums.txt

# An SBOM per archive, and checksums.txt signed without a key (Sigstore, the workflow's identity):
# install.sh verifies it when cosign is installed.
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args: ["sign-blob", "--yes", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}"]

changelog:
  disable: true # release notes come from CHANGELOG.md

release:
  draft: true
