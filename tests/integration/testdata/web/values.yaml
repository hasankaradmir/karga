# content is served at / (changing it recreates the workload through its Config).
content: v1
# healthy=false makes the healthcheck fail.
healthy: true
# publish=true adds a hostPort, which makes replace fall back to recreate.
publish: false
port: 18080
# startDelay seconds before the server listens, like a real application starting up.
startDelay: 0
# proxy=true puts a karga-managed Envoy in front (Linux only); with publish=true it holds the host port.
proxy: false
# listenPort is the port the server listens on (and the containerPort).
listenPort: 8080
