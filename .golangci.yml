version: "2"

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # The CLI talks to karga-server only through karga-sdk's API.
        cli:
          files:
            - "$all"
          deny:
            - pkg: github.com/hasankaradmir/karga-server
              desc: the CLI must not depend on karga-server
            - pkg: github.com/docker
              desc: the CLI never talks to Docker

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hasankaradmir/karga-cli
