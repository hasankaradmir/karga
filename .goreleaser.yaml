# Release builds: `git tag vX.Y.Z && git push --tags` runs .github/workflows/release.yml.
# Local check: goreleaser release --snapshot --clean
version: 2

project_name: karga

builds:
  - id: karga
    main: ./cmd/karga
    binary: karga
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hasankaradmir/karga/internal/version.Version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: karga-server
    main: ./cmd/karga-server
    binary: karga-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hasankaradmir/karga/internal/version.Version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - USAGE.md
      - CHANGELOG.md
      - LICENSE
      - deploy/systemd/karga-server.service

checksum:
  name_template: checksums.txt

changelog:
  disable: true # release notes come from CHANGELOG.md

release:
  draft: true
