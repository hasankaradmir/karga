{{- if .Values.tls.cert }}
apiVersion: karga.io/v1alpha1
kind: Secret
metadata:
  name: site-tls
spec:
  values:
    tls.crt: {{ .Values.tls.cert | quote }}
    tls.key: {{ .Values.tls.key | quote }}
---
{{- end }}
apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: web-net
---
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: site
spec:
  files:
    index.html: {{ .Values.content | quote }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; {{ if .Values.echo }}nc -ll -p 9000 -e cat & {{ end }}exec httpd -f -p {{ .Values.listenPort }} -h /www"]
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  ports:
    - name: http
      containerPort: {{ .Values.listenPort }}
    {{- if .Values.echo }}
    - name: echo
      containerPort: 9000
    {{- end }}
  healthCheck:
    type: {{ .Values.health }}
    {{- if eq .Values.health "exec" }}
    {{- if .Values.healthy }}
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ .Values.listenPort }}/"]
    {{- else }}
    command: ["false"]
    {{- end }}
    {{- else }}
    port: {{ .Values.listenPort }}
    {{- if eq .Values.health "http" }}
    path: {{ if .Values.healthy }}/{{ else }}/missing{{ end }}
    {{- end }}
    {{- end }}
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- if .Values.second }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: api
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; exec httpd -f -p {{ add .Values.listenPort 1 }} -h /www"]
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  ports:
    - name: http
      containerPort: {{ add .Values.listenPort 1 }}
  healthCheck:
    type: exec
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ add .Values.listenPort 1 }}/"]
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- end }}
---
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: web
spec:
  workload: web
  ports:
    - name: http
      port: {{ .Values.servicePort | default .Values.listenPort }}
    {{- if .Values.echo }}
    - name: echo
      port: 9000
    {{- end }}
  {{- if or .Values.listener .Values.route .Values.echoListener }}
  expose:
    {{- if .Values.listener }}
    - port: http
      listener: {{ .Values.listener }}
    {{- end }}
    {{- if .Values.route }}
    - port: http
      listener: {{ .Values.routeListener }}
      host: {{ .Values.route }}
      {{- if .Values.tls.cert }}
      tls: {secret: site-tls}
      {{- end }}
    {{- end }}
    {{- if .Values.echoListener }}
    - port: echo
      listener: {{ .Values.echoListener }}
    {{- end }}
  {{- end }}
{{- if .Values.second }}
---
apiVersion: karga.io/v1alpha1
kind: Service
metadata:
  name: api
spec:
  workload: api
  ports:
    - name: http
      port: {{ add .Values.listenPort 1 }}
{{- end }}
