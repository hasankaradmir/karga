{{- if .Values.tls.cert }}
apiVersion: karga.io/v1alpha1
kind: Secret
metadata:
  name: site-tls
spec:
  values:
    tls.crt: {{ .Values.tls.cert | quote }}
    tls.key: {{ .Values.tls.key | quote }}
---
{{- end }}
apiVersion: karga.io/v1alpha1
kind: Network
metadata:
  name: web-net
---
apiVersion: karga.io/v1alpha1
kind: Config
metadata:
  name: site
spec:
  files:
    index.html: {{ .Values.content | quote }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: web
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; {{ if .Values.echoPort }}nc -ll -p 9000 -e cat & {{ end }}exec httpd -f -p {{ .Values.listenPort }} -h /www"]
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  ports:
    {{- if .Values.echoPort }}
    - containerPort: 9000
      hostPort: {{ .Values.echoPort }}
    {{- end }}
    - containerPort: {{ .Values.listenPort }}
      {{- if .Values.publish }}
      hostPort: {{ .Values.port }}
      {{- end }}
      {{- if .Values.route }}
      routes:
        - host: {{ .Values.route }}
          hostPort: {{ .Values.port }}
          {{- if .Values.tls.cert }}
          tls: {secret: site-tls}
          {{- end }}
      {{- end }}
  healthCheck:
    type: exec
    {{- if .Values.healthy }}
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ .Values.listenPort }}/"]
    {{- else }}
    command: ["false"]
    {{- end }}
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- if .Values.second }}
---
apiVersion: karga.io/v1alpha1
kind: Workload
metadata:
  name: api
spec:
  image: busybox:1.37
  command: [sh, -c, "sleep {{ .Values.startDelay }}; exec httpd -f -p {{ add .Values.listenPort 1 }} -h /www"]
  networks: [web-net]
  mounts:
    - config: site
      mountPath: /www
  ports:
    - containerPort: {{ add .Values.listenPort 1 }}
  healthCheck:
    type: exec
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:{{ add .Values.listenPort 1 }}/"]
    interval: 1s
    timeout: 1s
    retries: 2
    startPeriod: 10s
  updateStrategy:
    type: {{ .Values.strategy }}
    drainTimeout: {{ .Values.drain }}
{{- end }}
