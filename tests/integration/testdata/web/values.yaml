# content is served at / (changing it recreates the workload through its Config).
content: v1
# healthy=false makes the healthcheck fail.
healthy: true
# publish=true adds a tcp hostPort (through the gateway on Linux; replace falls back to recreate elsewhere).
publish: false
# route=<host> serves the port as an HTTP route for that host on hostPort port (Linux gateway).
route: ""
port: 18080
# startDelay seconds before the server listens, like a real application starting up.
startDelay: 0
# strategy is the update strategy; replace puts the workload behind the release proxy on Linux.
strategy: replace
# listenPort is the port the server listens on (and the containerPort).
listenPort: 8080
# second=true adds workload api, serving the same content on listenPort+1.
second: false
